name: Reusable Terraform PR plan

on:
  workflow_call:
    inputs:
      environment:
        description: Environment name matching envs/<name>.tfvars
        required: true
        type: string

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_PR_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true
    permissions:
      contents: read
      id-token: write
    outputs:
      comment: ${{ steps.comment.outputs.body }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8
      - name: Sign in with the PR identity
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_PR_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Initialize ${{ inputs.environment }} state
        env:
          ENVIRONMENT_NAME: ${{ inputs.environment }}
          STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
          STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
        run: |
          terraform -chdir=infrastructure/platform init -input=false \
            -backend-config="resource_group_name=${STATE_RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${STATE_STORAGE_ACCOUNT}" \
            -backend-config="container_name=tfstate-${ENVIRONMENT_NAME}" \
            -backend-config="key=api-platform/${ENVIRONMENT_NAME}.tfstate" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"
      - name: Create ${{ inputs.environment }} plan
        id: plan
        continue-on-error: true
        shell: bash
        env:
          ENVIRONMENT_NAME: ${{ inputs.environment }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -o pipefail
          terraform -chdir=infrastructure/platform plan \
            -input=false \
            -lock=false \
            -no-color \
            -var-file="envs/${ENVIRONMENT_NAME}.tfvars" \
            -var="subscription_id=${SUBSCRIPTION_ID}" \
            -out="${RUNNER_TEMP}/${ENVIRONMENT_NAME}.tfplan" \
            2>&1 | tee "${RUNNER_TEMP}/${ENVIRONMENT_NAME}.txt"
      - name: Prepare sticky comment
        id: comment
        shell: bash
        env:
          ENVIRONMENT_NAME: ${{ inputs.environment }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          plan_file="${RUNNER_TEMP}/${ENVIRONMENT_NAME}.txt"
          comment_file="${RUNNER_TEMP}/${ENVIRONMENT_NAME}-comment.md"

          {
            echo "## Terraform plan: \`${ENVIRONMENT_NAME}\`"
            echo
            echo "Result: **${PLAN_OUTCOME}**"
            echo
          } > "${comment_file}"

          if [[ ! -f "${plan_file}" ]]; then
            {
              echo "Terraform did not produce plan output."
              echo
              echo "[Open the workflow run](${RUN_URL})"
            } >> "${comment_file}"
          elif (( $(wc -c < "${plan_file}") <= 58000 )); then
            {
              echo '<details open><summary>Show full plan output</summary>'
              echo
              echo '```text'
              cat "${plan_file}"
              echo '```'
              echo '</details>'
              echo
              echo "[Open the workflow run](${RUN_URL})"
            } >> "${comment_file}"
          else
            summary_file="${RUNNER_TEMP}/${ENVIRONMENT_NAME}-summary.txt"
            truncated_file="${RUNNER_TEMP}/${ENVIRONMENT_NAME}-truncated.txt"

            grep -E '^[[:space:]]*# .* (will be (created|updated in-place|destroyed)|must be replaced)' "${plan_file}" > "${summary_file}" || true
            grep -E '^Plan: ' "${plan_file}" >> "${summary_file}" || true
            awk -v max=48000 '
              {
                next_length = used + length($0) + 1
                if (next_length > max) exit
                print
                used = next_length
              }
            ' "${plan_file}" > "${truncated_file}"

            {
              echo "> [!WARNING]"
              echo "> The full plan exceeds the GitHub comment limit and was truncated. [Open the workflow run](${RUN_URL}) for the complete output."
              echo
              echo '### Change summary'
              echo
              echo '```text'
              if [[ -s "${summary_file}" ]]; then
                cat "${summary_file}"
              else
                echo 'No Terraform resource summary was found in the plan output.'
              fi
              echo '```'
              echo
              echo '<details><summary>Show truncated plan output</summary>'
              echo
              echo '```text'
              cat "${truncated_file}"
              echo '```'
              echo '</details>'
            } >> "${comment_file}"
          fi

          delimiter="TERRAFORM_PLAN_COMMENT_$(date +%s)_${RANDOM}"
          {
            echo "body<<${delimiter}"
            cat "${comment_file}"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"
      - name: Fail when Terraform plan failed
        if: steps.plan.outcome != 'success'
        run: exit 1

  comment:
    needs: plan
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Prepare plan comment message
        id: message
        shell: bash
        env:
          ENVIRONMENT_NAME: ${{ inputs.environment }}
          PLAN_COMMENT: ${{ needs.plan.outputs.comment }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          delimiter="PLAN_COMMENT_$(date +%s)_${RANDOM}"
          {
            echo "body<<${delimiter}"
            if [[ -n "${PLAN_COMMENT}" ]]; then
              printf '%s\n' "${PLAN_COMMENT}"
            else
              echo "## Terraform plan: \`${ENVIRONMENT_NAME}\`"
              echo
              echo "The plan did not complete, so no Terraform output was produced. [Open the workflow run](${RUN_URL}) for the failing step."
            fi
            echo "${delimiter}"
          } >> "${GITHUB_OUTPUT}"
      - name: Update ${{ inputs.environment }} plan comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: terraform-plan-${{ inputs.environment }}
          message: ${{ steps.message.outputs.body }}
          recreate: true
      - name: Fail when Terraform plan failed
        if: needs.plan.result != 'success'
        run: exit 1
