name: Deploy development

on:
  push:
    branches: [main]
    paths:
      - "infrastructure/**"
      - ".github/workflows/deploy-dev.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-development
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DEV_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Init, plan and apply development
        run: |
          terraform -chdir=infrastructure/environments/dev init -input=false \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate-dev" \
            -backend-config="key=api-platform/dev.tfstate" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"
          terraform -chdir=infrastructure/environments/dev plan -input=false \
            -var="subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID }}" -out=dev.tfplan
          terraform -chdir=infrastructure/environments/dev apply -input=false -auto-approve dev.tfplan

