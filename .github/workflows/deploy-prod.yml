name: Deploy production

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Change or release being promoted
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      plan_blob: ${{ steps.plan-reference.outputs.blob_name }}
      plan_sha256: ${{ steps.plan-reference.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_PLAN_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Plan production
        run: |
          terraform -chdir=infrastructure/environments/prod init -input=false \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate-prod" \
            -backend-config="key=api-platform/prod.tfstate" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"
          terraform -chdir=infrastructure/environments/prod plan -input=false -no-color \
            -var="subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID }}" -out=prod.tfplan \
            | tee "${{ runner.temp }}/prod.txt"
      - name: Define immutable plan location
        id: plan-reference
        shell: bash
        run: |
          echo "blob_name=production/${GITHUB_SHA}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tfplan" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum infrastructure/environments/prod/prod.tfplan | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Upload plan to private Azure Storage
        run: |
          az storage blob upload \
            --auth-mode login \
            --account-name "${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            --container-name tfplans \
            --name "${{ steps.plan-reference.outputs.blob_name }}" \
            --file infrastructure/environments/prod/prod.tfplan \
            --overwrite false
      - name: Publish plan summary
        run: |
          {
            echo "## Production plan"
            echo "Reason: ${{ inputs.reason }}"
            echo '```text'
            tail -n 200 "${{ runner.temp }}/prod.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_PROD_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Initialize production state
        run: |
          terraform -chdir=infrastructure/environments/prod init -input=false \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate-prod" \
            -backend-config="key=api-platform/prod.tfstate" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"
      - name: Download the approved plan from Azure Storage
        run: |
          az storage blob download \
            --auth-mode login \
            --account-name "${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            --container-name tfplans \
            --name "${{ needs.plan.outputs.plan_blob }}" \
            --file infrastructure/environments/prod/prod.tfplan \
            --overwrite true
      - name: Verify the approved plan checksum
        shell: bash
        run: |
          echo "${{ needs.plan.outputs.plan_sha256 }}  infrastructure/environments/prod/prod.tfplan" | sha256sum --check --strict
      - name: Apply the approved plan
        run: |
          terraform -chdir=infrastructure/environments/prod apply -input=false -auto-approve prod.tfplan

