name: Reusable environment deployment

on:
  workflow_call:
    inputs:
      environment:
        description: Environment name matching envs/<name>.tfvars
        required: true
        type: string
      github_environment:
        description: GitHub Environment used by the apply job
        required: true
        type: string
      reason:
        description: Human-readable deployment reason
        required: false
        default: Main deployment
        type: string

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_PLAN_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true
    permissions:
      contents: read
      id-token: write
    outputs:
      plan_blob: ${{ steps.plan-reference.outputs.blob_name }}
      plan_sha256: ${{ steps.plan-reference.outputs.sha256 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8
      - name: Sign in with the main plan identity
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_PLAN_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Initialize ${{ inputs.environment }} state
        env:
          ENVIRONMENT_NAME: ${{ inputs.environment }}
          STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
          STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
        run: |
          terraform -chdir=infrastructure/platform init -input=false \
            -backend-config="resource_group_name=${STATE_RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${STATE_STORAGE_ACCOUNT}" \
            -backend-config="container_name=tfstate-${ENVIRONMENT_NAME}" \
            -backend-config="key=api-platform/${ENVIRONMENT_NAME}.tfstate" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"
      - name: Create ${{ inputs.environment }} plan
        env:
          ENVIRONMENT_NAME: ${{ inputs.environment }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          # Main deployments are serialized; apply locks state and stale saved plans are rejected.
          terraform -chdir=infrastructure/platform plan \
            -input=false \
            -lock=false \
            -no-color \
            -var-file="envs/${ENVIRONMENT_NAME}.tfvars" \
            -var="subscription_id=${SUBSCRIPTION_ID}" \
            -out="${ENVIRONMENT_NAME}.tfplan" \
            | tee "${RUNNER_TEMP}/${ENVIRONMENT_NAME}.txt"
      - name: Define immutable plan reference
        id: plan-reference
        shell: bash
        env:
          ENVIRONMENT_NAME: ${{ inputs.environment }}
        run: |
          echo "blob_name=${ENVIRONMENT_NAME}/${GITHUB_SHA}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tfplan" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "infrastructure/platform/${ENVIRONMENT_NAME}.tfplan" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Upload plan to private Azure Storage
        env:
          ENVIRONMENT_NAME: ${{ inputs.environment }}
          PLAN_BLOB: ${{ steps.plan-reference.outputs.blob_name }}
          STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
        run: |
          az storage blob upload \
            --auth-mode login \
            --account-name "${STATE_STORAGE_ACCOUNT}" \
            --container-name tfplans \
            --name "${PLAN_BLOB}" \
            --file "infrastructure/platform/${ENVIRONMENT_NAME}.tfplan" \
            --overwrite false
      - name: Publish plan summary
        env:
          DEPLOY_REASON: ${{ inputs.reason }}
          ENVIRONMENT_NAME: ${{ inputs.environment }}
          PLAN_BLOB: ${{ steps.plan-reference.outputs.blob_name }}
          PLAN_SHA256: ${{ steps.plan-reference.outputs.sha256 }}
        run: |
          {
            echo "## ${ENVIRONMENT_NAME} plan"
            printf 'Reason: %s\n' "${DEPLOY_REASON}"
            echo
            echo "Blob: \`${PLAN_BLOB}\`"
            echo "SHA-256: \`${PLAN_SHA256}\`"
            echo
            echo '```text'
            tail -n 200 "${RUNNER_TEMP}/${ENVIRONMENT_NAME}.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    needs: plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.github_environment }}
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8
      - name: Sign in with the environment deployer identity
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Initialize ${{ inputs.environment }} state
        env:
          ENVIRONMENT_NAME: ${{ inputs.environment }}
          STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
          STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
        run: |
          terraform -chdir=infrastructure/platform init -input=false \
            -backend-config="resource_group_name=${STATE_RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${STATE_STORAGE_ACCOUNT}" \
            -backend-config="container_name=tfstate-${ENVIRONMENT_NAME}" \
            -backend-config="key=api-platform/${ENVIRONMENT_NAME}.tfstate" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"
      - name: Download the planned change from Azure Storage
        env:
          ENVIRONMENT_NAME: ${{ inputs.environment }}
          PLAN_BLOB: ${{ needs.plan.outputs.plan_blob }}
          STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
        run: |
          az storage blob download \
            --auth-mode login \
            --account-name "${STATE_STORAGE_ACCOUNT}" \
            --container-name tfplans \
            --name "${PLAN_BLOB}" \
            --file "infrastructure/platform/${ENVIRONMENT_NAME}.tfplan" \
            --overwrite true
      - name: Verify the planned change checksum
        shell: bash
        env:
          ENVIRONMENT_NAME: ${{ inputs.environment }}
          PLAN_SHA256: ${{ needs.plan.outputs.plan_sha256 }}
        run: |
          echo "${PLAN_SHA256}  infrastructure/platform/${ENVIRONMENT_NAME}.tfplan" | sha256sum --check --strict
      - name: Apply the verified plan without re-planning
        env:
          ENVIRONMENT_NAME: ${{ inputs.environment }}
        run: |
          terraform -chdir=infrastructure/platform apply \
            -input=false \
            -auto-approve \
            "${ENVIRONMENT_NAME}.tfplan"
