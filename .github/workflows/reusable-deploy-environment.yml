name: Reusable environment deployment

on:
  workflow_call:
    inputs:
      environment:
        description: Environment name matching envs/<name>.tfvars
        required: true
        type: string
      github_environment:
        description: GitHub Environment used by the apply job
        required: true
        type: string
      reason:
        description: Human-readable deployment reason
        required: false
        default: Main deployment
        type: string

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      plan_blob: ${{ steps.plan-reference.outputs.blob_name }}
      plan_sha256: ${{ steps.plan-reference.outputs.sha256 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.8
      - name: Sign in with the main plan identity
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_PLAN_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Initialize ${{ inputs.environment }} state
        run: |
          terraform -chdir=infrastructure/platform init -input=false \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate-${{ inputs.environment }}" \
            -backend-config="key=api-platform/${{ inputs.environment }}.tfstate" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"
      - name: Create ${{ inputs.environment }} plan
        run: |
          terraform -chdir=infrastructure/platform plan \
            -input=false \
            -no-color \
            -var-file="envs/${{ inputs.environment }}.tfvars" \
            -var="subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID }}" \
            -out="${{ inputs.environment }}.tfplan" \
            | tee "${{ runner.temp }}/${{ inputs.environment }}.txt"
      - name: Define immutable plan reference
        id: plan-reference
        shell: bash
        run: |
          echo "blob_name=${{ inputs.environment }}/${GITHUB_SHA}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tfplan" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "infrastructure/platform/${{ inputs.environment }}.tfplan" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Upload plan to private Azure Storage
        run: |
          az storage blob upload \
            --auth-mode login \
            --account-name "${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            --container-name tfplans \
            --name "${{ steps.plan-reference.outputs.blob_name }}" \
            --file "infrastructure/platform/${{ inputs.environment }}.tfplan" \
            --overwrite false
      - name: Publish plan summary
        run: |
          {
            echo "## ${{ inputs.environment }} plan"
            echo "Reason: ${{ inputs.reason }}"
            echo
            echo "Blob: \`${{ steps.plan-reference.outputs.blob_name }}\`"
            echo "SHA-256: \`${{ steps.plan-reference.outputs.sha256 }}\`"
            echo
            echo '```text'
            tail -n 200 "${{ runner.temp }}/${{ inputs.environment }}.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    needs: plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.github_environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.8
      - name: Sign in with the environment deployer identity
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Initialize ${{ inputs.environment }} state
        run: |
          terraform -chdir=infrastructure/platform init -input=false \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate-${{ inputs.environment }}" \
            -backend-config="key=api-platform/${{ inputs.environment }}.tfstate" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"
      - name: Download the planned change from Azure Storage
        run: |
          az storage blob download \
            --auth-mode login \
            --account-name "${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            --container-name tfplans \
            --name "${{ needs.plan.outputs.plan_blob }}" \
            --file "infrastructure/platform/${{ inputs.environment }}.tfplan" \
            --overwrite true
      - name: Verify the planned change checksum
        shell: bash
        run: |
          echo "${{ needs.plan.outputs.plan_sha256 }}  infrastructure/platform/${{ inputs.environment }}.tfplan" | sha256sum --check --strict
      - name: Apply the verified plan without re-planning
        run: |
          terraform -chdir=infrastructure/platform apply \
            -input=false \
            -auto-approve \
            "${{ inputs.environment }}.tfplan"
