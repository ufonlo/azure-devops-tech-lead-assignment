name: Terraform pull request

on:
  pull_request:
    paths:
      - "infrastructure/**"
      - ".github/workflows/**"

concurrency:
  group: terraform-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.8
      - name: Install TFLint
        uses: terraform-linters/setup-tflint@8093687ecc9dcbfa88d07c103ad4176739a7287e # v4.1.0
      - name: Check formatting
        run: terraform fmt -check -recursive infrastructure
      - name: Validate bootstrap
        run: |
          terraform -chdir=infrastructure/bootstrap init -backend=false -input=false
          terraform -chdir=infrastructure/bootstrap validate
      - name: Validate platform
        run: |
          terraform -chdir=infrastructure/platform init -backend=false -input=false
          terraform -chdir=infrastructure/platform validate
      - name: Run TFLint
        run: |
          tflint --init
          tflint --chdir=infrastructure/bootstrap
          tflint --chdir=infrastructure/platform
      - name: Scan Terraform configuration
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: config
          scan-ref: infrastructure
          severity: HIGH,CRITICAL
          exit-code: "1"

  plan-dev:
    needs: static-checks
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/reusable-pr-plan.yml
    with:
      environment: dev
    permissions:
      contents: read
      id-token: write
      pull-requests: write

  plan-prod:
    needs: static-checks
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/reusable-pr-plan.yml
    with:
      environment: prod
    permissions:
      contents: read
      id-token: write
      pull-requests: write
